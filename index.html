<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/calc.js" defer></script>
</head>
<body>  
    <div class="container">        
        <div class="box">
            <div class="input_box">
                <div id="display">
                    <div class="top-row">                        
                        <div id="expression"></div>                        
                    </div>
                    <div class="separator"></div>                    
                    <div class="bottom-row">     
                        <div id="lastOperator"></div>                   
                        <div id="result"></div>                        
                    </div>
                </div>
            </div>                

            <div class="input_box">
                <button class="delete_button" data-action="backspace">⌫</button>
                <button type="button" data-action="clear" data-value="C">AC</button>
                <button type="button" data-action="mod" data-value="%" id="op">%</button>
                <button type="button" class="button" data-action="division" data-value="/" id="op">÷</button>
            </div>            
            <div class="input_box">
                <button type="button" class="button" data-action="number" data-value="7">7</button>
                <button type="button" class="button" data-action="number" data-value="8">8</button>
                <button type="button" class="button" data-action="number" data-value="9">9</button>
                <button type="button" class="button" data-action="multiply" data-value="*" id="op">×</button>
            </div>            
            <div class="input_box">
                <button type="button" class="button" data-action="number" data-value="4">4</button>
                <button type="button" class="button" data-action="number" data-value="5">5</button>
                <button type="button" class="button" data-action="number" data-value="6">6</button>
                <button type="button" class="button" data-action="subtract" data-value="-" id="op">-</button>
            </div>            
            <div class="input_box">
                <button type="button" class="button" data-action="number" data-value="1">1</button>
                <button type="button" class="button" data-action="number" data-value="2">2</button>
                <button type="button" class="button" data-action="number" data-value="3">3</button>
                <button type="button" class="button" data-action="add" data-value="+" id="op">+</button>
            </div>            
            <div class="input_box">
                <button data-action="negate" data-value="C">+/-</button>
                <button type="button" class="button" data-action="number" data-value="0">0</button>
                <button type="button" class="button" data-action="decimal" data-value=".">.</button>
                <button type="button" class="equal_button" data-action="equals" data-value="=" id="op">=</button>
            </div>            
        </div>
    </div>
    <div class="particles" id="particle-container"></div>
</body>
</html>
